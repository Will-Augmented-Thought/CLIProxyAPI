name: Will image release

on:
  workflow_dispatch:
    inputs:
      publish_image:
        description: Publish the signed image for the current main revision
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  actions: read
  packages: write
  id-token: write

jobs:
  release:
    if: inputs.publish_image
    uses: Will-Augmented-Thought/will-devops/.github/workflows/reusable-docker-build-push-scan-sign.yml@main
    with:
      runner_label: wat-arc-runner-set-dind2
      registry_host: ${{ vars.REGISTRY_HOST }}
      image_name: cli-proxy-api
      manage_gitops: false
      promotion_phase: release
      checkout_will_common: false
      docker_read_auth: none
      build_args_json: '{"VERSION":"main"}'
      trivy_timeout: 20m
      trivy_scanners: vuln
    secrets:
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
      MINIO_CI_ARTIFACTS_ACCESS_KEY: ${{ secrets.MINIO_CI_ARTIFACTS_ACCESS_KEY }}
      MINIO_CI_ARTIFACTS_SECRET_KEY: ${{ secrets.MINIO_CI_ARTIFACTS_SECRET_KEY }}
